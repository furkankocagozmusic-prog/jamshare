<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>JamShare</title><style>body{font-family:Arial;background:#0b0d12;color:white;display:grid;place-items:center;height:100vh}form{background:#151821;padding:30px;border-radius:16px}input{display:block;padding:12px;margin:10px 0;background:#0c0f15;color:#fff;border:1px solid #333;border-radius:8px;width:260px}button{padding:12px;width:100%;background:#8b5cf6;color:white;border:0;border-radius:8px}a{color:#b9a3ff}</style></head><body><form method="post"><h2>{% if mode=='login' %}Giriş yap{% else %}Hesap oluştur{% endif %}</h2>{% with ms=get_flashed_messages() %}{% for m in ms %}<p>{{m}}</p>{% endfor %}{% endwith %}<input name="email" type="email" placeholder="E-posta" required>{% if mode=='register' %}<input name="username" placeholder="Kullanıcı adı" required>{% endif %}<input name="password" type="password" placeholder="Şifre" required><button>{% if mode=='login' %}Giriş{% else %}Kayıt ol{% endif %}</button><p><a href="/">Ana sayfa</a></p></form></body></html>
