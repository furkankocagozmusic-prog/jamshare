<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>JamShare Admin</title><style>body{font-family:Arial;background:#0b0d12;color:#fff;max-width:1000px;margin:auto;padding:30px}.box{background:#151821;padding:18px;border-radius:12px;margin:12px 0}td,th{padding:9px;border-bottom:1px solid #333;text-align:left}table{width:100%}button{background:#d44;color:white;border:0;padding:7px;border-radius:6px}a{color:#b9a3ff}</style></head><body><h1>Admin Paneli 🛠️</h1><p><a href="/">Site</a> <a href="/logout">Çıkış</a></p><div class="box"><h2>Kullanıcılar ({{users|length}})</h2><table><tr><th>Kullanıcı</th><th>E-posta</th><th>Rol</th></tr>{% for u in users %}<tr><td>{{u.username}}</td><td>{{u.email}}</td><td>{{u.role}}</td></tr>{% endfor %}</table></div><div class="box"><h2>Kayıtlar ({{tracks|length}})</h2>{% for t in tracks %}<p><b>{{t.title}}</b> — {{t.username}} <form style="display:inline" method="post" action="/admin/delete/{{t.id}}"><button>Sil</button></form></p>{% endfor %}</div></body></html>
